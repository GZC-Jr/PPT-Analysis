<!DOCTYPE html>
<html lang="zh-CN" style="height: 100%;">
<head>
    <meta charset="UTF-8">
    <title>Chart View</title>
    <style>
        /* 确保图表填满整个可用空间 */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #2E2E2E; /* 匹配应用的暗色主题 */
            overflow: hidden; /* 隐藏滚动条 */
        }
        #chart-container {
            width: 100%;
            height: 100%;
            display: flex; /* 使用flex布局来并排显示图表 */
            justify-content: space-around;
            align-items: center;
        }
        /* 每个图表的容器 */
        .chart {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body style="height: 100%; margin: 0;">

    <div id="chart-container">
        <!-- JS将在这里动态创建图表div -->
    </div>

    <!-- 引入ECharts库和我们的逻辑脚本 -->
    <script src="echarts.min.js"></script>
    <script src="chart_view.js"></script>
</body>
</html>
